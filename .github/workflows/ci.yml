name: Tests and package validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
      - name: Validate installation and syntax
        run: |
          python -m pip check
          python -m compileall -q agents lab_tat_sentinel_agent cli.py lab_tat_sentinel.py enrichment.py simulator.py
          lab-tat-sentinel-engine --help
      - name: Run regression tests
        run: python -m pytest -q
      - name: Smoke test documented CSV
        run: python cli.py batch -i sample.csv -o /tmp/lab-tat-sentinel-results.csv

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate browser rules
        run: |
          node --check web/app.mjs
          node --test tests/browser.test.mjs
